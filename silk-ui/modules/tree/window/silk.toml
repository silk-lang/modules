[package]
include = ["browser"]
name = "ui-tree-window"
description = "Hosts a ui-tree in a platform window"
version = "0.1.0"
kind = "library"
exports = ["lib", "adapter", "keys", "accessibility", "host", "group_host", "background", "images", "loader", "sheets", "style_watch", "remote", "input_router", "compositor_thread", "render_thread", "render_inline", "canvas_frames", "canvas_bitmaps", "canvas_layer_plan", "gpu_canvas", "platform_thread", "console", "clock", "browser", "companion", "web_access", "headless", "screen_reader", "speech"]

[dependencies]
ui_protocol = { path = "../../protocol", package = "ui-protocol" }
ui_transport = { path = "../../transport", package = "ui-transport" }
ui_screen_reader = { path = "../../screen_reader", package = "ui-screen-reader" }
ui_tree = { path = "..", package = "ui-tree" }
accesskit = { path = "../../accesskit", package = "accesskit" }
accesskit_macos = { path = "../../accesskit/macos", package = "accesskit-macos" }
accesskit_windows = { path = "../../accesskit/windows", package = "accesskit-windows" }
accesskit_unix = { path = "../../accesskit/unix", package = "accesskit-unix" }
dbus = { path = "../../dbus", package = "dbus" }
webview = { path = "../../webview", package = "ui-webview" }
window = { path = "../../../../lib/native/modules/platform/window", package = "platform-window" }

ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
font_web = { path = "../../../../lib/fonts/modules/web", package = "font-web" }
font_collection = { path = "../../../../lib/fonts/modules/collection", package = "font-collection" }
atlas = { path = "../../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
vector = { path = "../../../../lib/graphics/modules/vector", package = "graphics-vector" }
ui_scene = { path = "../../../../lib/graphics/modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "../../../../lib/graphics/modules/ui_renderer", package = "graphics-ui-renderer" }
webgpu = { path = "../../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../../lib/native/modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
codec = { path = "../../../../lib/graphics/modules/codec", package = "graphics-codec" }
