[package]
name = "silkjs-runtime-silkcrypto"
description = "Crypto for the SilkJS runtime in Silk, over silk.crypto, with no C library: an implementation of its Crypto capability"
version = "0.1.0"
kind = "library"
# `silk_crypto` is SilkCrypto.
exports = ["silk_crypto"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
