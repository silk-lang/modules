[package]
name = "loom-inspect"
description = "The silk-ui inspector extension: a program's messages, its model after each, and the Program panel"
version = "0.1.0"
kind = "library"
exports = ["lib", "program", "panel", "extension"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { path = "../../../../silk-ui/modules/tree", package = "ui-tree" }
ui_protocol = { path = "../../../../silk-ui/modules/protocol", package = "ui-protocol" }
ui_inspect_server = { path = "../../../../silk-ui/modules/inspect/server", package = "ui-inspect-server" }
