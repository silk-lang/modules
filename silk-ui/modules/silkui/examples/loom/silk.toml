[package]
name = "loom-counter"
description = "A counter written in Loom, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
source = "silk"
kind = "library"
exports = ["app"]

[dependencies]
loom = { path = "../../../../../loom/modules/loom", package = "loom" }

silkui = { path = "../..", package = "silkui" }
silkui_window_loom = { path = "../../../../../loom/modules/silkui/window", package = "silkui-window-loom" }
silkui_web_canvas = { path = "../../../../../loom/modules/silkui/web/canvas", package = "silkui-web-canvas" }
silkui_web_dom = { path = "../../../../../loom/modules/silkui/web/dom", package = "silkui-web-dom" }
loom_dom = { path = "../../../../../loom/modules/loom/dom", package = "loom-dom" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
platform_window = { path = "../../../../../lib/native/modules/platform/window", package = "platform-window" }
webgpu = { path = "../../../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
