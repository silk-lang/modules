[package]
name = "silkjs-runtime-silkhttp2"
description = "HTTP/2 for the SilkJS runtime in Silk, with no C library: an implementation of its Http2 capability"
version = "0.1.0"
kind = "library"
# `silk_http2` is SilkHttp2.
exports = ["silk_http2"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
