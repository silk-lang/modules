<!doctype html>
<meta charset="utf-8">
<title>getComputedStyle loops</title>
<!-- The loops of src/main.silk in a browser, for comparison: open it, read the console. -->
<style>
  body { margin: 0; font-size: 10px; color: rgb(0, 0, 255) }
  .row { padding: 4px 1em; margin: 2px; border: 1px solid red; display: flex; cursor: pointer; height: 12px }
  .row:nth-child(odd) { opacity: 0.5 }
</style>
<body>
<script>
  const rows = [];
  for (let i = 0; i < 1000; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.textContent = "row " + i;
    document.body.appendChild(row);
    rows.push(row);
  }
  const first = getComputedStyle(rows[0]);
  let sink = 0;
  const loops = [
    ["empty loop (subtracted from the rest)", () => { for (let i = 0; i < 1000; i++) sink += i; }],
    ["style.opacity, one node", () => { for (let i = 0; i < 1000; i++) sink += first.opacity.length; }],
    ["style.cursor, one node", () => { for (let i = 0; i < 1000; i++) sink += first.cursor.length; }],
    ["style.width, one node", () => { for (let i = 0; i < 1000; i++) sink += first.width.length; }],
    ["getPropertyValue('padding-left'), one node", () => { for (let i = 0; i < 1000; i++) sink += first.getPropertyValue("padding-left").length; }],
    ["getComputedStyle(row).paddingLeft, 1,000 nodes", () => { for (let i = 0; i < 1000; i++) sink += getComputedStyle(rows[i]).paddingLeft.length; }],
    ["getComputedStyle(row).color, 1,000 nodes", () => { for (let i = 0; i < 1000; i++) sink += getComputedStyle(rows[i]).color.length; }],
    ["write height then read it, 1,000 times", () => { for (let i = 0; i < 1000; i++) { rows[i].style.height = (10 + i % 7) + "px"; sink += first.height.length; } }],
  ];
  const results = [];
  let empty = 0;
  for (const [name, loop] of loops) {
    const times = [];
    for (let run = 0; run < 7; run++) {
      // Ten loops a sample: browsers round performance.now() to tens of microseconds.
      const start = performance.now();
      for (let k = 0; k < 10; k++) loop();
      times.push((performance.now() - start) / 10);
    }
    times.sort((a, b) => a - b);
    const median = times[3];
    if (results.length === 0) empty = median;
    const line = name + ": " + (results.length === 0 ? median : median - empty).toFixed(3) + " us per read";
    results.push(line);
    console.log(line);
  }
  window.results = results;
</script>
