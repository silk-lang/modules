[package]
name = "silkjs-runtime-silktls"
description = "TLS for the SilkJS runtime in Silk, over silk.tls, with no C library: an implementation of its Tls capability"
version = "0.1.0"
kind = "library"
# `silk_tls` is SilkTls.
exports = ["silk_tls"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
