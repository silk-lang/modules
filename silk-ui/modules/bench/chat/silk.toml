[package]
name = "ui-bench-chat"
description = "Headless first layout of xbench's chat scene (1,000 messages) on the real ui-tree and stylesheet: text shaping time, counts and an output checksum"
version = "0.1.0"
license = "MIT"

[dependencies]
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_text = { path = "../../text", package = "ui-text" }
font_collection = { path = "../../../../lib/fonts/modules/collection", package = "font-collection" }
layout = { path = "../../../../lib/css/modules/layout", package = "css-layout" }
