[package]
include = ["js"]
name = "loom-dom"
description = "Runs a loom program in a browser document"
version = "0.1.0"
kind = "library"
exports = ["lib", "wire", "dom", "page", "html", "grid_css", "virtual"]

[dependencies]
loom = { path = "..", package = "loom" }
ui_tree = { path = "../../../../silk-ui/modules/tree", package = "ui-tree" }
ui_protocol = { path = "../../../../silk-ui/modules/protocol", package = "ui-protocol" }
css_style = { path = "../../../../lib/css/modules/style", package = "css-style" }
