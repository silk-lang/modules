[package]
name = "ui-inspect-server"
description = "The inspector protocol: a running UI answers JSON requests on a local socket"
version = "0.1.0"
kind = "library"
exports = ["lib", "devtools", "channel", "topics", "session", "reply", "names", "remote", "extension", "protocol", "nodes", "tools", "edits", "timeline", "server", "client", "mcp", "commands", "cli", "shots"]

[dependencies]
ui_inspect = { path = "..", package = "ui-inspect" }
ui_transport = { path = "../../transport", package = "ui-transport" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_scene = { path = "../../../../lib/graphics/modules/ui_scene", package = "graphics-ui-scene" }
vector = { path = "../../../../lib/graphics/modules/vector", package = "graphics-vector" }
codec = { path = "../../../../lib/graphics/modules/codec", package = "graphics-codec" }
css_style = { path = "../../../../lib/css/modules/style", package = "css-style" }
