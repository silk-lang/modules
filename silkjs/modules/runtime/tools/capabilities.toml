# Which service of the composable runtime (docs/composable-runtime.md) owns each built-in, Silk
# module and native function. tools/embed.py tags each built-in with its service, so the bootstrap
# registers only those of the services a program has; `silk task graph` in tools/capabilities
# reports on all three and checks the edges between services. Moving a file to another service
# is a change here.
#
# A rule matches a name that equals one of `names` or starts with one of `prefixes`. Rules are
# tried in order and the first match wins; what matches none is the core's.

# The closed list, in the design's order. "Core" and "Executable" are not services: the core is
# always linked, and the executable's own pieces (command line, REPL, test runner, SEA) only it has.
services = ["Platform", "ModuleResolver", "Files", "Network", "Processes", "SystemInfo", "Workers",
  "Crypto", "Tls", "Compression", "Http", "Http2", "Wasm", "Database", "TypeStripping", "Inspector",
  "NativeAddons", "HostApi"]

# What each service may name, as "Services that need each other" states it: embed.start checks
# these pairs, and any other edge across a service line fails the check. Platform and
# ModuleResolver are always real, so every service may name them.
[[need]]
service = "Network"
needs = ["Http"]
[[need]]
service = "Tls"
needs = ["Network", "Crypto"]
[[need]]
service = "Http2"
needs = ["Network", "Tls"]
[[need]]
service = "Inspector"
needs = ["Network"]
[[need]]
service = "TypeStripping"
needs = ["Wasm"]
[[need]]
service = "Database"
needs = ["Files"]
[[need]]
service = "Wasm"
needs = ["Files"]
[[need]]
service = "Processes"
needs = ["Network"]
[[need]]
service = "Executable"
needs = ["Platform", "ModuleResolver", "Files", "Network", "Processes", "SystemInfo", "Workers",
  "Crypto", "Tls", "Compression", "Http", "Http2", "Wasm", "Database", "TypeStripping", "Inspector",
  "NativeAddons", "HostApi"]

# Built-in JavaScript, by the name it is required by.
# The message event classes are the core's: worker ports and broadcast channels use them as
# WebSocket does, so they are there without the network.
[[builtin]]
service = "Core"
# Tracing, the console's hook for an inspector and the V8 profiles (heap snapshots, coverage and
# --heap-prof) are the core's: they use the engine, not the inspector protocol, and
# the console, diagnostics channels, fs and http report to them whether or not there is one.
names = ["internal/web/websocket/events", "internal/trace_events", "internal/inspector_console", "trace_events",
  "internal/trace_events_binding", "internal/profiler_binding", "internal/heap_prof", "internal/inspector_profiles",
  "internal/inspector_values", "internal/worker/profiles"]
[[builtin]]
service = "TypeStripping"
names = ["internal/deps/amaro", "internal/modules/typescript"]
prefixes = ["internal/deps/amaro/"]
[[builtin]]
service = "Wasm"
names = ["wasi", "internal/web/wasm"]
prefixes = ["internal/web/wasm/"]
[[builtin]]
service = "Database"
names = ["sqlite", "internal/web/storage", "internal/inspector_dom_storage"]
prefixes = ["internal/sqlite/"]
[[builtin]]
service = "NativeAddons"
names = ["internal/napi"]
[[builtin]]
service = "Http2"
names = ["http2", "internal/http2", "internal/inspector/network_http2"]
prefixes = ["internal/http2/"]
[[builtin]]
service = "Network"
names = ["internal/inspector/network_http", "internal/inspector/network_undici"]
[[builtin]]
service = "Http"
names = ["internal/http/native-parser", "_http_common"]
[[builtin]]
service = "Tls"
names = ["tls", "https", "_tls_common", "_tls_wrap"]
prefixes = ["internal/tls/"]
[[builtin]]
service = "Crypto"
names = ["crypto", "internal/crypto"]
prefixes = ["internal/crypto/", "internal/crypto_"]
[[builtin]]
service = "Compression"
names = ["zlib", "internal/webstreams/compression", "internal/web/compression"]
prefixes = ["zlib/", "internal/compression/"]
[[builtin]]
service = "Inspector"
names = ["inspector"]
prefixes = ["inspector/", "internal/inspector"]
[[builtin]]
service = "Workers"
names = ["worker_threads", "internal/worker", "internal/worker/io", "internal/worker/locks", "internal/worker/broadcast",
  "internal/process/worker_thread_only"]
[[builtin]]
service = "Processes"
names = ["child_process", "internal/child_process", "cluster"]
prefixes = ["internal/child_process/", "internal/cluster/"]
[[builtin]]
service = "SystemInfo"
names = ["os", "internal/os_binding"]
[[builtin]]
service = "Files"
names = ["fs", "internal/fs", "internal/fs_async", "internal/path_events/glob"]
prefixes = ["fs/", "internal/fs/"]
[[builtin]]
service = "Network"
# tty: a terminal stream is a socket of the network's, as in Node.
names = ["net", "tty", "dgram", "dns", "internal/net", "internal/dgram", "internal/socketaddress", "internal/socket_list",
  "internal/blocklist", "internal/block_list_binding", "internal/stream_base_commons", "internal/js_stream_socket",
  "_http_agent", "_http_client", "_http_incoming", "_http_outgoing", "_http_server", "http", "internal/http",
  "internal/web/fetch", "internal/web/websocket", "internal/web/eventsource", "internal/web/serve", "internal/ws",
  "internal/deps/undici"]
prefixes = ["dns/", "internal/dns/", "internal/net/", "internal/web/fetch/", "internal/web/websocket/",
  "internal/web/eventsource/", "internal/web/serve/", "internal/deps/undici/"]
[[builtin]]
service = "ModuleResolver"
names = ["internal/modules/helpers", "internal/modules/package_json_reader", "internal/modules/package_map",
  "internal/modules/customization_hooks", "internal/modules_binding"]
prefixes = ["internal/loader/", "internal/modules/cjs/", "internal/modules/esm/"]
[[builtin]]
service = "Executable"
names = ["repl", "internal/repl", "test", "sea", "internal/sea", "internal/postgres_rows", "internal/options_table"]
prefixes = ["internal/repl/", "internal/main/", "test/", "internal/test_runner/", "internal/test/", "internal/watch_mode/",
  "internal/debugger/"]

# Silk modules and C files, by their path under src/.
[[silk]]
service = "Platform"
prefixes = ["libs/core/platforms", "ext/platform_native"]
[[silk]]
service = "ModuleResolver"
prefixes = ["libs/core/module_sources", "ext/module_native"]
[[silk]]
service = "Wasm"
prefixes = ["ext/wasm_", "ext/wasi_", "ext/wamr"]
[[silk]]
service = "Database"
prefixes = ["ext/sqlite_native", "ext/webstorage_native"]
[[silk]]
service = "NativeAddons"
prefixes = ["ext/napi_"]
[[silk]]
service = "Http2"
prefixes = ["ext/http2_"]
[[silk]]
service = "Http"
prefixes = ["ext/http_parser_"]
[[silk]]
service = "Tls"
prefixes = ["ext/tls_", "ext/openssl_x509"]
[[silk]]
service = "Crypto"
prefixes = ["ext/crypto_native", "ext/openssl"]
[[silk]]
service = "Compression"
prefixes = ["ext/compression_"]
[[silk]]
service = "Inspector"
# The protocol and its server (./inspector). Profiles, coverage, tracing, reports and the debugger
# metadata the engine keeps on code are the core's.
prefixes = ["ext/inspector_native", "ext/inspector_route", "ext/inspector_transport", "node_inspector"]
[[silk]]
service = "Workers"
prefixes = ["ext/worker_"]
[[silk]]
service = "Processes"
prefixes = ["ext/process_native", "ext/process_abi", "ext/spawn_sync"]
[[silk]]
service = "SystemInfo"
prefixes = ["ext/os_"]
[[silk]]
service = "Files"
prefixes = ["ext/fs_native", "ext/fs_ops", "ext/fs_descriptors", "ext/uv_fs", "libs/core/files"]
[[silk]]
service = "Network"
prefixes = ["ext/net_native", "ext/dns_", "ext/uv_net"]
[[silk]]
service = "Executable"
names = ["main.silk", "tasks.silk"]
prefixes = ["ext/sea_", "ext/heap_image"]

