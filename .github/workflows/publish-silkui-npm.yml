name: Publish @silkui/* npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (false runs a dry run)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test packages
        working-directory: silk-ui/modules/js
        run: |
          npm install -g npm@latest
          npm ci
          npm test
      - name: Publish packages in dependency order
        working-directory: silk-ui/modules/js
        env:
          DO_PUBLISH: ${{ inputs.publish }}
        run: |
          for pkg in core react foldkit vite; do
            dir="packages/$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version (already published)"
              continue
            fi
            if [ "$DO_PUBLISH" = "true" ]; then
              npm publish --workspace="$dir" --access public --provenance
            else
              npm publish --workspace="$dir" --access public --dry-run
            fi
          done
