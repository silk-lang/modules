[package]
name = "ui-ghostty"
description = "A terminal component for loom programs, rendered on the UI tree from libghostty-vt snapshots: cells, cursor, selection, scrollback, keys, paste, mouse reporting"
version = "0.1.0"
kind = "library"
exports = ["view", "speech"]

[dependencies]
ghostty_vt = { path = "vt", package = "ghostty-vt" }
loom = { path = "../loom", package = "loom" }
