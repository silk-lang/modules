[package]
name = "svg"
description = "An SVG renderer written from the SVG 1.1 and SVG 2 specifications"
version = "0.1.0"
kind = "library"
exports = ["image_assets", "mask_layer_sources", "svg_intrinsic", "scene", "mapping", "resolve", "url", "resources", "resources_native", "style_tree", "stylesheets", "document_styles", "font_metrics", "vector_path", "view_fragment", "view_selection", "conditional", "structure", "occurrence_tree", "animation", "css_animations", "color_profiles"]

[dependencies]
svg_geometry = { path = "../../graphics/modules/geometry", package = "graphics-geometry" }
svg_css = { path = "../../css/modules/style", package = "css-style" }
svg_image = { path = "../../graphics/modules/codec", package = "graphics-codec" }
font_types = { path = "../../fonts/modules/types", package = "font-types" }
read_fonts = { path = "../../fonts/modules/parse", package = "font-parse" }
harfrust = { path = "../../fonts/modules/shape", package = "font-shape" }
vector = { path = "../../graphics/modules/vector", package = "graphics-vector" }
svg_filters = { path = "filters", package = "svg-filters" }
svg_fonts = { path = "../../fonts/modules/faces", package = "font-faces" }
svg_text = { path = "text", package = "svg-text" }
css_properties = { path = "../../css/modules/properties", package = "css-properties" }
