[package]
name = "silkui-web-canvas"
description = "What the hosts silkui generates for a Loom app on the web-canvas target run: the tree, drawn with WebGPU on the page's canvas"
version = "0.1.0"
kind = "library"
main = "app.silk"
exports = ["app", "gpu"]

[dependencies]
loom = { path = "../../../loom", package = "loom" }
loom_window = { path = "../../../loom/window", package = "loom-window" }
ui_fixtures = { path = "../../../../../silk-ui/modules/tree/fixtures", package = "ui-tree-fixtures" }
webgpu = { path = "../../../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../../../lib/native/modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
