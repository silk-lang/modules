<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory dispatches — static feed test</title>
<style>
  body { font: 1.1rem/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  article { padding: 1rem 0; border-top: 1px solid gray; }
  article:focus-visible { outline: 3px solid Highlight; outline-offset: 4px; }
  h2, p { margin: .25rem 0; }
</style>
<main>
  <h1 id="feed-name">Observatory dispatches</h1>
  <p><a href="#after">Skip past the feed</a></p>
  <!-- Only three articles exist. ARIA puts the logical size on each article,
       not on the feed. Neither the name nor any article text states the size. -->
  <div role="feed" aria-labelledby="feed-name">
    <article tabindex="0" aria-labelledby="first" aria-posinset="1" aria-setsize="100">
      <h2 id="first">First light</h2>
      <p>Venus is visible just before sunrise.</p>
    </article>
    <article tabindex="0" aria-labelledby="second" aria-posinset="2" aria-setsize="100">
      <h2 id="second">The cloud report</h2>
      <p>Thin clouds crossed the western sky. The northern horizon stayed clear.</p>
    </article>
    <article tabindex="0" aria-labelledby="third" aria-posinset="3" aria-setsize="100">
      <h2 id="third">At the telescope</h2>
      <p>The team aligned the finder scope using Vega.</p>
    </article>
  </div>
  <p id="after" tabindex="-1">End of the example.</p>
</main>
</html>
