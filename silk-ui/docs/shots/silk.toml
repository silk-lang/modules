[package]
name = "ui-docs-shots"
description = "Draws the pictures the Silk UI docs show, from the example programs"
version = "0.1.0"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { path = "../examples/window", package = "ui-docs-window-client" }
loom = { path = "../../../loom/modules/loom", package = "loom" }
loom_tree = { path = "../../../loom/modules/loom/tree", package = "loom-tree" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { path = "../../modules/assets", package = "ui-assets" }
font_collection = { path = "../../../lib/fonts/modules/collection", package = "font-collection" }
codec = { path = "../../../lib/graphics/modules/codec", package = "graphics-codec" }
vector = { path = "../../../lib/graphics/modules/vector", package = "graphics-vector" }
svg_css = { path = "../../../lib/css/modules/style", package = "css-style" }
