[package]
name = "silkjs-wamr"
description = "WAMR, the WebAssembly interpreter behind the SilkJS runtime's WebAssembly and WASI, with SIMDe"
version = "2.4.5"
kind = "library"
exports = ["lib"]

# vendor/ is WAMR at its pinned commit with vendor/patches applied, reduced to what builds
# (tools/vendor_wamr.py writes it: Silk can fetch an archive but not patch it). glue/ is the
# runtime's C over WAMR's API (silk_wamr.h), which src/ext/wamr_abi.silk in the runtime binds.
[native.archive.silkjs-simde]
url = "https://codeload.github.com/simd-everywhere/simde/tar.gz/71fd833d9666141edcd1d3c109a80e228303d8d7"
sha256 = "72b2c14a487560b7eb203795f2c2fead5c7499662e639944cca2a9bb19f09029"
strip = 1
