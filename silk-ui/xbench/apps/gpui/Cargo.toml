[package]
name = "xbench-gpui"
version = "0.1.0"
edition = "2024"
publish = false

# GPUI from the Zed repository, pinned: vendor/zed is a shallow, sparse checkout of
# zed-industries/zed at v1.29.2 (2de9e435), made by ./fetch.sh. GPUI is a path dependency: a git
# dependency would clone all of Zed's history.
[dependencies]
gpui = { path = "vendor/zed/crates/gpui", features = ["test-support"] }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", features = ["x11", "wayland"] }
xbench-scenes = { path = "../rust-scenes" }

# Zed's own release profile, without debug info.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

[workspace]
exclude = ["vendor"]
