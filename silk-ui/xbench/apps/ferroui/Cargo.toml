[package]
name = "xbench-ferroui"
version = "0.1.0"
edition = "2024"
publish = false

# FerroUI as published on crates.io (0.5.0): its declarative layer (ferroui-view), the controls,
# the Fluent theme, Skia for drawing and the headless platform for the cpu suite.
[dependencies]
ferroui-base = "=0.5.0"
ferroui-controls = "=0.5.0"
ferroui-view = { version = "=0.5.0", features = ["desktop"] }
ferroui-themes-fluent = "=0.5.0"
ferroui-desktop = "=0.5.0"
ferroui-skia = "=0.5.0"
ferroui-headless = "=0.5.0"
xbench-scenes = { path = "../rust-scenes" }

[profile.release]
opt-level = 3
codegen-units = 16
debug = false
debug-assertions = false
overflow-checks = false

[workspace]
