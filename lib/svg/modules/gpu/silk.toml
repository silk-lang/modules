[package]
name = "svg-gpu"
description = "Draws SVG display lists on the GPU through graphics-gpu-scene"
version = "0.1.0"
kind = "library"
exports = ["scene"]

[dependencies]
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
vector = { path = "../../../graphics/modules/vector", package = "graphics-vector" }
gpu_scene = { path = "../../../graphics/modules/gpu_scene", package = "graphics-gpu-scene" }
webgpu = { path = "../../../native/modules/gpu/webgpu", package = "gpu-webgpu" }
