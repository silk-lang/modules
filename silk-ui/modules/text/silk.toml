[package]
name = "ui-text"
description = "css-layout's TextMeasure over real fonts, with line breaking, bidi and fallback from std"
version = "0.1.0"
kind = "library"
exports = ["lib", "fonts", "set", "glyphs", "analysis", "shaping", "system"]

[dependencies]
layout = { path = "../../../lib/css/modules/layout", package = "css-layout" }
properties = { path = "../../../lib/css/modules/properties", package = "css-properties" }
font_collection = { path = "../../../lib/fonts/modules/collection", package = "font-collection" }
faces = { path = "../../../lib/fonts/modules/faces", package = "font-faces" }
harfrust = { path = "../../../lib/fonts/modules/shape", package = "font-shape" }
read_fonts = { path = "../../../lib/fonts/modules/parse", package = "font-parse" }
font_types = { path = "../../../lib/fonts/modules/types", package = "font-types" }
raster = { path = "../../../lib/fonts/modules/raster", package = "font-raster" }
