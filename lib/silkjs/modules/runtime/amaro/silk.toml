[package]
name = "silkjs-runtime-amaro"
description = "TypeScript stripping for the SilkJS runtime, with amaro: the real implementation of its TypeStripping capability"
version = "0.1.0"
kind = "library"
# `amaro_stripping` is Amaro.
exports = ["amaro_stripping"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }

# amaro's JavaScript (3.8 MB), embedded only into a program that depends on this package
# (amaro_sources.c, written by tools/embed.py).
