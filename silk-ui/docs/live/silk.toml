[package]
name = "ui-docs-live"
description = "The native and tree examples of the docs, built for a WebGPU canvas in the page"
version = "0.1.0"
kind = "executable"

[dependencies]
examples = { path = "../examples", package = "ui-docs-examples" }
window_client = { path = "../examples/window", package = "ui-docs-window-client" }
loom = { path = "../../../loom/modules/loom", package = "loom" }
loom_window = { path = "../../../loom/modules/loom/window", package = "loom-window" }
ui_tree = { path = "../../modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../modules/tree/window", package = "ui-tree-window" }
ui_fixtures = { path = "../../modules/tree/fixtures", package = "ui-tree-fixtures" }
ui_assets = { path = "../../modules/assets", package = "ui-assets" }
window = { path = "../../../lib/native/modules/platform/window", package = "platform-window" }
webgpu = { path = "../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../lib/native/modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }
ui_inspect_server = { path = "../../modules/inspect/server", package = "ui-inspect-server" }
atlas = { path = "../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
vector = { path = "../../../lib/graphics/modules/vector", package = "graphics-vector" }
svg_css = { path = "../../../lib/css/modules/style", package = "css-style" }
