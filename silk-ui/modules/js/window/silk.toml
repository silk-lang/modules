[package]
name = "ui-js-window"
description = "Runs a ui-js application in a platform window: its timers, animation frames and console on the window host's loop"
version = "0.1.0"
kind = "library"
exports = ["lib", "natives", "codecs", "opener", "shell"]

[dependencies]
ui_js = { path = "..", package = "ui-js" }
ui_js_gpu = { path = "../gpu", package = "ui-js-gpu" }
ui_js_calls = { path = "../calls", package = "ui-js-calls" }
ui_tree = { path = "../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../tree/window", package = "ui-tree-window" }
ui_inspect_server = { path = "../../inspect/server", package = "ui-inspect-server" }
ui_transport = { path = "../../transport", package = "ui-transport" }
codec = { path = "../../../../lib/graphics/modules/codec", package = "graphics-codec" }
silkjs = { path = "../../../../silkjs/modules/engine", package = "silkjs-engine" }
webview = { path = "../../webview", package = "ui-webview" }
window = { path = "../../../../lib/native/modules/platform/window", package = "platform-window" }
