[package]
name = "ui-js-node-check"
description = "Runs fixtures/net.js in the runtime-backed ui-js realm against fixtures/server.mjs: fetch, WebSocket and the other web APIs, @silkui/core and __ui"
version = "0.1.0"

[dependencies]
ui_js = { path = "../..", package = "ui-js" }
ui_js_node = { path = "..", package = "ui-js-node" }
silkjs = { path = "../../../../../silkjs/modules/engine", package = "silkjs-engine" }
node_runtime = { path = "../../../../../silkjs/modules/runtime", package = "silkjs-runtime" }
wasm = { path = "../../../../../silkjs/modules/runtime/wamr", package = "silkjs-runtime-wamr" }
compress = { path = "../../../../../silkjs/modules/runtime/compress", package = "silkjs-runtime-compress" }
http2 = { path = "../../../../../silkjs/modules/runtime/http2", package = "silkjs-runtime-nghttp2" }
http = { path = "../../../../../silkjs/modules/runtime/llhttp", package = "silkjs-runtime-llhttp" }
database = { path = "../../../../../silkjs/modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
openssl = { path = "../../../../../silkjs/modules/runtime/openssl", package = "silkjs-runtime-openssl" }
inspector = { path = "../../../../../silkjs/modules/runtime/inspector", package = "silkjs-runtime-inspector" }
amaro = { path = "../../../../../silkjs/modules/runtime/amaro", package = "silkjs-runtime-amaro" }
addons = { path = "../../../../../silkjs/modules/runtime/napi", package = "silkjs-runtime-napi" }
