[package]
name = "silkui-window-node"
description = "What the hosts silkui generates for a JavaScript app on the full SilkJS runtime in a window run"
version = "0.1.0"
kind = "library"
main = "node.silk"
exports = ["node"]

[dependencies]
silkui_window = { path = "..", package = "silkui-window" }
ui_js = { path = "../../../js", package = "ui-js" }
ui_js_node = { path = "../../../js/node", package = "ui-js-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_tree_window = { path = "../../../tree/window", package = "ui-tree-window" }
font_collection = { path = "../../../../../lib/fonts/modules/collection", package = "font-collection" }
silkjs = { path = "../../../../../silkjs/modules/engine", package = "silkjs-engine" }
node_runtime = { path = "../../../../../silkjs/modules/runtime", package = "silkjs-runtime" }
window = { path = "../../../../../lib/native/modules/platform/window", package = "platform-window" }
webgpu = { path = "../../../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
atlas = { path = "../../../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
vector = { path = "../../../../../lib/graphics/modules/vector", package = "graphics-vector" }
wasm = { path = "../../../../../silkjs/modules/runtime/wamr", package = "silkjs-runtime-wamr" }
database = { path = "../../../../../silkjs/modules/runtime/sqlite", package = "silkjs-runtime-sqlite" }
addons = { path = "../../../../../silkjs/modules/runtime/napi", package = "silkjs-runtime-napi" }
silkhttp = { path = "../../../../../silkjs/modules/runtime/silkhttp", package = "silkjs-runtime-silkhttp" }
silkcrypto = { path = "../../../../../silkjs/modules/runtime/silkcrypto", package = "silkjs-runtime-silkcrypto" }
silktls = { path = "../../../../../silkjs/modules/runtime/silktls", package = "silkjs-runtime-silktls" }
silkcompress = { path = "../../../../../silkjs/modules/runtime/silkcompress", package = "silkjs-runtime-silkcompress" }
