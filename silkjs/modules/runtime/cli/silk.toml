[package]
name = "silkjs-runtime-cli"
description = "The silkjs executable's program: the runtime with the real implementation of every capability"
version = "0.1.0"
kind = "library"
# `executable` is the program (./silkjs runs it, ./silk with the Silk libraries); `napi_exports`
# the Node-API functions that take a callback.
exports = ["executable", "napi_exports"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
wasm = { path = "../wamr", package = "silkjs-runtime-wamr" }
compress = { path = "../compress", package = "silkjs-runtime-compress" }
http2 = { path = "../http2", package = "silkjs-runtime-nghttp2" }
http = { path = "../llhttp", package = "silkjs-runtime-llhttp" }
database = { path = "../sqlite", package = "silkjs-runtime-sqlite" }
openssl = { path = "../openssl", package = "silkjs-runtime-openssl" }
inspector = { path = "../inspector", package = "silkjs-runtime-inspector" }
amaro = { path = "../amaro", package = "silkjs-runtime-amaro" }
addons = { path = "../napi", package = "silkjs-runtime-napi" }
# The package manager: `silkjs install` and the other commands.
pm = { path = "../../pm" }
