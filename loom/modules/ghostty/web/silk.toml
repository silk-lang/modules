[package]
name = "ui-ghostty-web"
description = "The terminal component in a browser page: libghostty-vt in WebAssembly on the DOM host, with a small built-in shell"
version = "0.1.0"
kind = "executable"

[dependencies]
ui_ghostty = { path = "..", package = "ui-ghostty" }
ghostty_vt = { path = "../vt", package = "ghostty-vt" }
loom = { path = "../../loom", package = "loom" }
loom_tree = { path = "../../loom/tree", package = "loom-tree" }
loom_dom = { path = "../../loom/dom", package = "loom-dom" }
ui_tree = { path = "../../../../silk-ui/modules/tree", package = "ui-tree" }
ui_fixtures = { path = "../../../../silk-ui/modules/tree/fixtures", package = "ui-tree-fixtures" }
