[package]
name = "silkjs-runtime"
version = "0.1.0"
# The runtime's core (docs/composable-runtime.md): the embedding API (src/runtime/embed.silk), the
# loop it turns, and the capabilities an embedder chooses (src/libs/core/capabilities.silk). The
# real Wasm capability is ./wamr, the real Compression ./compress, the real Http2 ./http2, the real Http ./llhttp, the real Database ./sqlite, the real Crypto and Tls ./openssl, the real Inspector ./inspector, the real TypeStripping ./amaro, the real NativeAddons ./napi; the executable, which provides every real one, is ./cli.
# src/embed_smoke.silk is the embedding API's smoke test, here without WebAssembly.
exports = ["runtime.embed", "runtime.session", "runtime.worker", "libs.core.capabilities", "libs.core.module_sources", "libs.core.platforms", "libs.core.files", "libs.core.host", "libs.core.common",
  "libs.core.owners", "ext.diagnostics_fatal", "ext.library_hooks", "ext.fs_ops", "ext.script_metadata", "ext.diagnostics_hub", "ext.inspector_debugger", "ext.inspector_evaluate", "ext.inspector_values", "ext.fs_async", "ext.blocking_pool", "ext.resource_snapshot", "ext.vm_native", "ext.keep_exports", "ext.worker_native", "ext.uv_fs", "ext.uv_errno", "ext.process_abi", "embed_smoke"]
kind = "library"

[dependencies]
# The engine, from this repository's modules/engine. The core links no C library: its loop is
# silk.io.reactor's (docs/composable-runtime.md, the loop plan); libuv's C API (in Silk) is ./napi's, for addons.
silkjs = { path = "../engine", package = "silkjs-engine" }
# The benchmark tasks (bench/README.md) are written with the package of ../benchkit.
benchkit = { path = "../benchkit" }

# The runtime's own C is in build.silk: builtin_sources.c embeds the built-in JavaScript, which
# tools/embed.py rewrites when a built-in is added or removed. tools/build.py links the executable
# with the built-ins' bytecode and a build identity besides.
