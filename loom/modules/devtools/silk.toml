[package]
name = "ui-inspect-devtools"
description = "A devtools window for a running Silk UI"
version = "0.1.0"
kind = "library"
exports = ["lib", "data", "link", "remote", "devtools", "embedded", "group"]

[dependencies]
loom = { path = "../loom", package = "loom" }
loom_tree = { path = "../loom/tree", package = "loom-tree" }
ui_tree = { path = "../../../silk-ui/modules/tree", package = "ui-tree" }
ui_inspect = { path = "../../../silk-ui/modules/inspect", package = "ui-inspect" }
ui_inspect_server = { path = "../../../silk-ui/modules/inspect/server", package = "ui-inspect-server" }
ui_tree_window = { path = "../../../silk-ui/modules/tree/window", package = "ui-tree-window" }
ui_transport = { path = "../../../silk-ui/modules/transport", package = "ui-transport" }
properties = { path = "../../../lib/css/modules/properties", package = "css-properties" }
window = { path = "../../../lib/native/modules/platform/window", package = "platform-window" }
font_collection = { path = "../../../lib/fonts/modules/collection", package = "font-collection" }
atlas = { path = "../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
ui_scene = { path = "../../../lib/graphics/modules/ui_scene", package = "graphics-ui-scene" }
