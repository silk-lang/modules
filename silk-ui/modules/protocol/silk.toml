[package]
name = "ui-protocol"
description = "The plain data a UI tree and its client exchange: mutations, input, event records, node ids, and the propagation walk"
version = "0.1.0"
kind = "library"
exports = ["animatable", "stylesheet", "lib", "backend", "error", "input", "record", "request", "id", "event", "mutation", "prevent", "editing", "snapshot", "virtual_list", "rich", "aria", "batch", "css", "grid", "options", "root", "style_bundle"]

[dependencies]
layout = { path = "../../../lib/css/modules/layout", package = "css-layout" }
properties = { path = "../../../lib/css/modules/properties", package = "css-properties" }
codec = { path = "../../../lib/graphics/modules/codec", package = "graphics-codec" }
style = { path = "../../../lib/css/modules/style", package = "css-style" }
