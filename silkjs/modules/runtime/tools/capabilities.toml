# Data on the natives object that belongs to a service.
[[native]]
name = "fsConstants"
service = "Files"
[[native]]
name = "rawOS"
service = "Platform"
[[native]]
name = "rawStd"
service = "Platform"

# C libraries: what the source of a native object belongs to, by the archive or package pinning it
# or by a part of its path, and the service it is linked for.
[[library]]
name = "OpenSSL"
service = "Crypto, Tls"
pins = ["silkjs-openssl"]
[[library]]
name = "SQLite"
service = "Database"
pins = ["db-sqlite"]
[[library]]
name = "WAMR"
service = "Wasm"
pins = ["silkjs-simde", "silkjs-wamr"]
paths = ["/native/wamr/"]
[[library]]
name = "libuv"
service = "NativeAddons"
pins = ["silkjs-uv"]
paths = ["/native/libuv/"]
[[library]]
name = "zlib"
service = "Compression"
pins = ["silkjs-zlib"]
[[library]]
name = "zstd"
service = "Compression"
pins = ["silkjs-zstd"]
[[library]]
name = "brotli"
service = "Compression"
pins = ["silkjs-brotli"]
paths = ["/native/brotli/"]
[[library]]
name = "nghttp2"
service = "Http2"
pins = ["silkjs-nghttp2"]
paths = ["/native/nghttp2/"]
[[library]]
name = "OpenSSL"
service = "Crypto, Tls"
paths = ["/native/openssl/"]
[[library]]
name = "llhttp"
service = "Http"
paths = ["llhttp/vendor/", "http_parser_bridge.c"]
[[library]]
name = "inspector transport"
service = "Inspector"
paths = ["inspector_transport.c"]
[[library]]
name = "built-in JavaScript source"
service = "Core and every service"
paths = ["builtin_sources.c"]
