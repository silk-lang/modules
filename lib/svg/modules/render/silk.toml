[package]
name = "svg-render"
description = "Parses, resolves and renders SVG with the vector CPU backend"
version = "0.1.0"
kind = "library"
exports = ["lib", "record", "environment", "native_environment"]

[dependencies]
svg_geometry = { path = "../../../graphics/modules/geometry", package = "graphics-geometry" }
svg_core = { path = "..", package = "svg" }
svg_raster = { path = "../raster", package = "svg-raster" }
svg_css = { path = "../../../css/modules/style", package = "css-style" }
read_fonts = { path = "../../../fonts/modules/parse", package = "font-parse" }
# CPU output is the backend-owned pixmap; encoding borrows its pixels without a copy.
vector = { path = "../../../graphics/modules/vector", package = "graphics-vector" }
svg_fonts = { path = "../../../fonts/modules/faces", package = "font-faces" }
