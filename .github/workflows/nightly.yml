name: Nightly

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  silk-ui-release:
    name: SilkUI release checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: silk-lang/action@v1
        with:
          cache-key: nightly-ui-${{ matrix.os }}
          cache-paths: |
            build
            lib/native/.cache
      - name: Provision Linux GPU
        if: runner.os == 'Linux'
        run: |
          silk task --manifest-path lib/native/silk.toml system-prerequisites
          silk task --manifest-path lib/native/silk.toml setup-ci --linux-gpu
      - name: Run SilkUI native release checks
        run: silk task --manifest-path silk-ui/silk.toml native check

  svg-conformance:
    name: SVG conformance suite
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: silk-lang/action@v1
        with:
          cache-key: nightly-svg-conformance
          cache-paths: |
            build
            lib/svg/.cache
            lib/svg/modules/tests/.cache
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ coreutils libarchive-dev fonts-dejavu-core fonts-freefont-ttf
          silk task --manifest-path lib/svg/bootstrap/silk.toml install-lexbor
          silk task --manifest-path lib/svg/bootstrap/silk.toml install-xerces
      - name: Run SVG and XML conformance
        run: silk task --manifest-path lib/svg/silk.toml conformance
      - uses: actions/upload-artifact@v4
        with:
          name: svg-conformance
          path: build/svg-conformance
          retention-days: 30
