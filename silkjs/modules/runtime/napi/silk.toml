[package]
name = "silkjs-runtime-napi"
description = "Node-API and process.dlopen for the SilkJS runtime: the real implementation of its NativeAddons capability"
version = "0.1.0"
kind = "library"
# `dlopen_addons` is DlopenAddons; the Node-API modules are the executable's too (cli/src/napi_exports.silk).
# libuv 1.51's C API, which addons call, is Silk here (ext/uv_loop, ext/uv_api_*): no C library.
exports = ["dlopen_addons", "ext.napi_async", "ext.napi_core", "ext.napi_loop", "ext.napi_values", "ext.uv_loop", "ext.uv_api_loop", "ext.uv_api_abi", "ext.uv_shapes"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
