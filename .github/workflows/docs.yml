name: SilkUI Docs

on:
  pull_request:
    paths:
      - 'silk-ui/docs/**'
      - 'silk-ui/modules/**'
      - 'loom/**'
      - 'lib/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'silk-ui/docs/**'
      - 'silk-ui/modules/**'
      - 'loom/**'
      - 'lib/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: silk-lang/action@v1
        with:
          cache-key: silk-ui-docs
      - name: Install Linux window headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Build SilkUI docs site
        run: silk task --manifest-path silk-ui/docs/silk.toml build-site
      - uses: actions/upload-artifact@v4
        with:
          name: silk-ui-docs
          path: silk-ui/docs/dist
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: silk-ui/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
