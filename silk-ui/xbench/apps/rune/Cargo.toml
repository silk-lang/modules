[package]
name = "xbench-rune"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rune = { path = "vendor/rune/crates/rune", features = ["tooling"] }
xbench-scenes = { path = "../rust-scenes" }

# Rune's own `perf` profile: release codegen, no incremental, no debug assertions.
[profile.release]
opt-level = 3
codegen-units = 16
lto = false
debug = false
incremental = false
debug-assertions = false
overflow-checks = false

# The patches Rune's workspace applies; a dependency's [patch] does not reach its dependents.
[patch.crates-io]
wgpu-hal = { path = "vendor/rune/vendor/wgpu-hal" }
winit = { path = "vendor/rune/vendor/winit" }
parley_engine = { path = "vendor/rune/vendor/parley_engine" }

[workspace]
exclude = ["vendor"]
