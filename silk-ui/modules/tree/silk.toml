[package]
name = "ui-tree"
description = "The retained UI tree: plain-data mutations, CSS layout, painting into a UI scene"
version = "0.1.0"
kind = "library"
exports = ["lib", "canvas2d", "access", "legacy", "engine", "engine_raster", "mutation", "css", "style", "resources", "provider", "node", "paint", "tree", "id", "event", "error", "inspect", "batch", "grid", "grid_css", "expand", "canvas_text", "input", "interact", "scrollbar", "edit", "rich", "caret", "virtual_list", "canvas_view", "anchoring", "image_load", "cssom_view", "transform", "paint_css", "paint_effects", "style_identity", "selection", "text_selection", "placeholder", "scrollbar_parts", "sheet_faces", "selector_tree", "containers", "container_watch", "style_assets", "style_media", "style_compiler", "style_runtime", "style_load", "process_memory", "computed_style", "observers", "css_cursor", "battery", "query", "live_svg", "svg_styles", "canvas_raster", "digest", "layout_table", "thin", "census"]

[dependencies]
ui_transport = { path = "../transport", package = "ui-transport" }
accesskit = { path = "../accesskit", package = "accesskit" }
ui_protocol = { path = "../protocol", package = "ui-protocol" }
layout = { path = "../../../lib/css/modules/layout", package = "css-layout" }
properties = { path = "../../../lib/css/modules/properties", package = "css-properties" }
ui_text = { path = "../text", package = "ui-text" }
font_collection = { path = "../../../lib/fonts/modules/collection", package = "font-collection" }
font_raster = { path = "../../../lib/fonts/modules/raster", package = "font-raster" }
font_types = { path = "../../../lib/fonts/modules/types", package = "font-types" }
read_fonts = { path = "../../../lib/fonts/modules/parse", package = "font-parse" }
atlas = { path = "../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
ui_scene = { path = "../../../lib/graphics/modules/ui_scene", package = "graphics-ui-scene" }
sprites = { path = "../sprites", package = "ui-sprites" }
vector = { path = "../../../lib/graphics/modules/vector", package = "graphics-vector" }
codec = { path = "../../../lib/graphics/modules/codec", package = "graphics-codec" }
svg_render = { path = "../../../lib/svg/modules/render", package = "svg-render" }
svg_core = { path = "../../../lib/svg/modules", package = "svg" }
svg_text = { path = "../../../lib/svg/modules/text", package = "svg-text" }
svg_css = { path = "../../../lib/css/modules/style", package = "css-style" }
svg_fonts = { path = "../../../lib/fonts/modules/faces", package = "font-faces" }
svg_geometry = { path = "../../../lib/graphics/modules/geometry", package = "graphics-geometry" }
