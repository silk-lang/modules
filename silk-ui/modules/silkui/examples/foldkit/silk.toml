[package]
main = "tasks.silk"
name = "foldkit-counter"
description = "A counter written with Foldkit, built and run by silkui: silk task dev, silk task build"
version = "0.1.0"
source = "."

# The app is JavaScript, in js/. Silk only builds the tasks, which build and run the app.

[dependencies]
silkui = { path = "../..", package = "silkui" }
silkui_window = { path = "../../window", package = "silkui-window" }
silkui_window_node = { path = "../../window/node", package = "silkui-window-node" }
ui_tree = { path = "../../../tree", package = "ui-tree" }
ui_inspect_server = { path = "../../../inspect/server", package = "ui-inspect-server" }
silkjs = { path = "../../../../../silkjs/modules/engine", package = "silkjs-engine" }
node_runtime = { path = "../../../../../silkjs/modules/runtime", package = "silkjs-runtime" }
