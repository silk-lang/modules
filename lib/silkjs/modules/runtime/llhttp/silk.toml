[package]
name = "silkjs-runtime-llhttp"
description = "The HTTP/1 parser of the SilkJS runtime, over llhttp: the real implementation of its Http capability"
version = "0.1.0"
kind = "library"
# `llhttp` is Llhttp.
exports = ["llhttp"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }

# llhttp 9.4.3 (vendor/, THIRD_PARTY_NOTICES) and the bridge that calls back into Silk,
# compiled into a program only when it depends on this package.
