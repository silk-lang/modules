[package]
name = "loom-window"
description = "Runs a loom application in a native window"
version = "0.1.0"
kind = "library"
exports = ["lib", "background", "images", "commands", "keeper", "program"]

[dependencies]
loom = { path = "..", package = "loom" }
loom_tree = { path = "../tree", package = "loom-tree" }
ui_tree = { path = "../../../../silk-ui/modules/tree", package = "ui-tree" }
ui_tree_window = { path = "../../../../silk-ui/modules/tree/window", package = "ui-tree-window" }
ui_transport = { path = "../../../../silk-ui/modules/transport", package = "ui-transport" }
ui_inspect_server = { path = "../../../../silk-ui/modules/inspect/server", package = "ui-inspect-server" }
loom_inspect = { path = "../inspect", package = "loom-inspect" }
ui_devtools = { path = "../../devtools", package = "ui-inspect-devtools" }
font_collection = { path = "../../../../lib/fonts/modules/collection", package = "font-collection" }
atlas = { path = "../../../../lib/graphics/modules/atlas", package = "graphics-atlas" }
vector = { path = "../../../../lib/graphics/modules/vector", package = "graphics-vector" }
ui_scene = { path = "../../../../lib/graphics/modules/ui_scene", package = "graphics-ui-scene" }
ui_renderer = { path = "../../../../lib/graphics/modules/ui_renderer", package = "graphics-ui-renderer" }
window = { path = "../../../../lib/native/modules/platform/window", package = "platform-window" }
webgpu = { path = "../../../../lib/native/modules/gpu/webgpu", package = "gpu-webgpu" }
webgpu_sys = { path = "../../../../lib/native/modules/gpu/webgpu/sys", package = "gpu-webgpu-sys" }

codec = { path = "../../../../lib/graphics/modules/codec", package = "graphics-codec" }
