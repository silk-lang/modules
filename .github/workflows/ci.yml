name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Plan affected jobs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      core: ${{ steps.plan.outputs.core }}
      gpu: ${{ steps.plan.outputs.gpu }}
      browser: ${{ steps.plan.outputs.browser }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      silkjs: ${{ steps.plan.outputs.silkjs }}
      ghostty: ${{ steps.plan.outputs.ghostty }}
      silk_ui_js: ${{ steps.plan.outputs.silk_ui_js }}
      docs: ${{ steps.plan.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: silk-lang/action@v1
        with:
          clang: 'false'
          cache-key: ci-plan
      - name: Compute affected jobs from dependency graph
        id: plan
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          silk task ci-plan --base "$BASE" --github-output "$GITHUB_OUTPUT"

  linux-core:
    name: Linux core
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-core
          cache-paths: |
            build
            lib/svg/.cache
      - name: Install Linux core system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ coreutils \
            libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libarchive-dev libjpeg-turbo-progs fonts-dejavu-core fonts-freefont-ttf
      - name: Check formatting
        run: silk format --check tasks.silk silk.toml lib/crdt lib/sqlite
      - name: Check and test lib/sqlite
        run: |
          silk check --package db-sqlite
          silk test --manifest-path lib/sqlite/silk.toml --root src/tests.silk
      - name: Check, test, and build lib/crdt
        run: silk task --manifest-path lib/crdt/silk.toml ci
      - name: Check and test lib/css
        run: silk task --manifest-path lib/css/silk.toml ci
      - name: Check and test lib/fonts
        run: |
          silk task --manifest-path lib/fonts/silk.toml check
          silk task --manifest-path lib/fonts/silk.toml check-wasm
      - name: Check and test lib/svg (CPU + Wasm)
        run: |
          silk task --manifest-path lib/svg/bootstrap/silk.toml install-lexbor
          silk task --manifest-path lib/svg/bootstrap/silk.toml install-xerces
          silk task --manifest-path lib/svg/silk.toml check
          silk task --manifest-path lib/svg/silk.toml check-wasm

  linux-ui-core:
    name: Linux UI core (loom + silk-ui)
    needs: plan
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-ui-core
      - name: Install Linux window headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Check and test loom
        run: silk task --manifest-path loom/silk.toml check
      - name: Check and test silk-ui
        run: taskset -c 0,1 silk task --manifest-path silk-ui/silk.toml check

  linux-gpu:
    name: Linux GPU and native GUI
    needs: plan
    if: needs.plan.outputs.gpu == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-gpu
          cache-paths: |
            build
            lib/native/.cache
            lib/svg/.cache
      - name: Provision Linux GPU and window prerequisites
        run: |
          silk task --manifest-path lib/native/silk.toml system-prerequisites
          silk task --manifest-path lib/native/silk.toml setup-ci --linux-gpu
      - name: Test lib/native (workspace, native, cross-check, pixels, window)
        run: |
          silk task --manifest-path lib/native/silk.toml check-workspace
          silk task --manifest-path lib/native/silk.toml test-native
          silk task --manifest-path lib/native/silk.toml cross-check
          silk task --manifest-path lib/native/silk.toml native-pixels
          silk task --manifest-path lib/native/modules/platform/window/silk.toml linux smoke
          silk build --manifest-path lib/native/modules/gpu/webgpu/examples-window/silk.toml
      - name: Test lib/graphics (CPU + GPU)
        run: silk task --manifest-path lib/graphics/silk.toml check
      - name: Test lib/svg GPU
        run: |
          sudo apt-get update && sudo apt-get install -y cmake g++ libarchive-dev
          silk task --manifest-path lib/svg/bootstrap/silk.toml install-lexbor
          silk task --manifest-path lib/svg/silk.toml test-gpu
      - name: Test loom native GUI
        run: |
          silk task --manifest-path loom/silk.toml native demo modules/loom/demo -- check
          silk task --manifest-path loom/silk.toml native devtools check
          silk task --manifest-path loom/silk.toml native navigation
      - name: Test silk-ui native GUI
        run: |
          silk task --manifest-path silk-ui/silk.toml native demo modules/tree/demo -- check
          silk task --manifest-path silk-ui/silk.toml native demo modules/tree/window/demo -- check
          silk task --manifest-path silk-ui/silk.toml native inspect
          silk task --manifest-path silk-ui/silk.toml native mcp

  linux-browser:
    name: Linux browser WebGPU and UI
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-browser
          cache-paths: |
            build
            lib/native/.cache
      - name: Provision browser and GPU environment
        run: |
          silk task --manifest-path lib/native/silk.toml system-prerequisites --browser
          silk task --manifest-path lib/native/silk.toml setup-ci --browser --linux-gpu
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run lib/native browser tests
        run: silk task --manifest-path lib/native/silk.toml test-browser
      - name: Run lib/graphics browser tests
        run: silk task --manifest-path lib/graphics/silk.toml test-browser
      - name: Run silk-ui browser server test
        working-directory: silk-ui
        run: silk test --manifest-path silk.toml --root src/task_browser_server.silk
      - name: Run silk-ui browser check
        run: silk task --manifest-path silk-ui/silk.toml browser check

  linux-silkjs:
    name: Linux SilkJS
    needs: plan
    if: needs.plan.outputs.silkjs == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-silkjs
      - name: Check capability graph and core SilkJS packages
        run: |
          silk task --manifest-path silkjs/silk.toml check-capabilities
          silk task --manifest-path silkjs/silk.toml check
      - name: Run embedding smoke and capability symbol checks
        working-directory: silkjs/modules/runtime
        run: python3 tests/embed-smoke.py
      - name: Run SilkJS differential and compat tests
        working-directory: silkjs/modules/runtime
        run: |
          mkdir -p build/silk build/native
          SILKJS_CLANG_BUILD="$PWD/build/silk" silk build --manifest-path cli/silk/silk.toml --debug true --clang "$PWD/tools/clang.py"
          cp "$(python3 tools/built.py silkjs-silk)" build/silk/silkjs
          SILKJS_CLANG_BUILD="$PWD/build/native" silk build --manifest-path cli/silkjs/silk.toml --debug false --optimization speed --clang "$PWD/tools/clang.py"
          cp "$(python3 tools/built.py silkjs --release)" build/native/silkjs
          node tests/compression-differential.mjs build/silk/silkjs
          node tests/crypto-differential.mjs build/silk/silkjs
          node tests/http-parser-differential.mjs build/silk/silkjs build/native/silkjs
          SILKJS_RUNTIME="$PWD/build/native/silkjs" node tests/compat.mjs

  linux-ghostty:
    name: Linux Ghostty
    needs: plan
    if: needs.plan.outputs.ghostty == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-ghostty
          cache-paths: |
            build
            loom/modules/ghostty/vt/native/build
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - name: Install Linux window headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Prepare libghostty-vt (native + wasm)
        run: python3 loom/modules/ghostty/vt/scripts/prepare --wasm
      - name: Test and build Ghostty packages
        run: |
          silk test --manifest-path loom/modules/ghostty/vt/silk.toml
          silk test --manifest-path loom/modules/ghostty/tests/silk.toml
          silk test --manifest-path loom/modules/ghostty/demo/silk.toml
          silk test --manifest-path loom/modules/ghostty/web/silk.toml
          silk build --manifest-path loom/modules/ghostty/demo/silk.toml
          silk task --manifest-path loom/modules/ghostty/web/silk.toml build-web

  linux-silk-ui-js:
    name: Linux SilkUI JS packages and Node bridge
    needs: plan
    if: needs.plan.outputs.silk_ui_js == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: silk-lang/action@v1
        with:
          cache-key: linux-silk-ui-js
      - name: Install Linux window headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev wayland-protocols
      - name: Verify @silkui/vite compiler.wasm is up to date
        run: silk task --manifest-path silk-ui/modules/js/packages/vite/compiler/silk.toml sync-wasm --check
      - name: Test and build @silkui/* npm packages
        working-directory: silk-ui/modules/js
        run: |
          npm ci
          npm test
          npm run build
      - name: Run ui-js example tests
        working-directory: silk-ui
        run: silk test --manifest-path modules/js/examples/tests/silk.toml
      - name: Test ui-js-node bridge
        run: silk task --manifest-path silk-ui/modules/js/node/tests/silk.toml check

  macos:
    name: macOS
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: silk-lang/action@v1
        with:
          cache-key: macos
          cache-paths: |
            build
            lib/native/.cache
            loom/modules/ghostty/vt/native/build
      - name: Test lib/sqlite and lib/crdt
        run: |
          silk test --manifest-path lib/sqlite/silk.toml --root src/tests.silk
          silk task --manifest-path lib/crdt/silk.toml ci
      - name: Test lib/css
        run: silk task --manifest-path lib/css/silk.toml ci
      - name: Test lib/fonts
        working-directory: lib/fonts
        run: |
          silk check -p font-types -p font-parse -p font-shape -p font-outline -p font-raster -p font-faces -p font-collection -p font-web -p font-parse-bench -p font-shape-bench -p font-shape-wasm -p font-parse-test-harness -p font-shape-test-harness
          for pkg in types parse shape outline raster faces collection web; do
            silk test --manifest-path "modules/$pkg/silk.toml" --root src/tests.silk
          done
          silk build -p font-parse-test-harness -p font-shape-test-harness -p font-parse-bench
      - name: Test lib/native on macOS
        run: |
          silk task --manifest-path lib/native/silk.toml setup-ci
          silk task --manifest-path lib/native/silk.toml check-workspace
          silk task --manifest-path lib/native/silk.toml test-native
          silk task --manifest-path lib/native/silk.toml test-macos
      - name: Test loom and silk-ui on macOS
        run: |
          silk test --manifest-path loom/modules/loom/window/tests/silk.toml
          silk test --manifest-path silk-ui/modules/accesskit/macos/silk.toml
          silk test --manifest-path silk-ui/modules/tree/window/tests/silk.toml

  windows:
    name: Windows
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: silk-lang/action@v1
        with:
          cache-key: windows
          cache-paths: |
            build
            lib/native/.cache
            loom/modules/ghostty/vt/native/build
      - name: Prepare and test lib/sqlite on Windows
        shell: pwsh
        run: |
          silk task --manifest-path lib/sqlite/silk.toml prepare-windows
          silk test --manifest-path lib/sqlite/silk.toml --root src/tests.silk
      - name: Prepare and test lib/native on Windows
        shell: pwsh
        run: |
          silk task --manifest-path lib/native/silk.toml setup-ci
          silk task --manifest-path lib/native/silk.toml prepare-windows --runtime-directory build/x86_64-pc-windows-msvc/dev
          silk task --manifest-path lib/native/silk.toml check-workspace
          silk task --manifest-path lib/native/silk.toml test-windows
      - name: Test loom and silk-ui on Windows
        shell: pwsh
        run: |
          silk test --manifest-path loom/modules/loom/window/tests/silk.toml
          silk test --manifest-path silk-ui/modules/accesskit/windows/silk.toml
          silk test --manifest-path silk-ui/modules/tree/window/tests/silk.toml
          silk test --manifest-path silk-ui/modules/inspect/server/tests/silk.toml
