<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="tailwind-small.css">
<main class="flex flex-col gap-4 p-4 bg-white text-slate-900 dark:bg-slate-900 dark:text-white">
  <button id="button" class="rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-600 focus-visible:outline-2 disabled:opacity-50">Save</button>
  <section class="group flex gap-2" data-state="open">
    <span class="group-hover:text-red-500 data-[state=open]:font-bold" data-state="open">Open</span>
    <input class="peer" type="checkbox" checked>
    <span class="peer-checked:font-bold">Checked</span>
  </section>
  <div class="grid grid-cols-2 gap-2 md:grid-cols-3"><span class="p-2">One</span><span class="p-2">Two</span></div>
</main>
