[package]
name = "silkjs-runtime-compress"
description = "Compression for the SilkJS runtime, with zlib and Zstandard in Silk (ZLIB_NOTES.md, ZSTD_NOTES.md) and brotli: the real implementation of its Compression capability"
version = "0.1.0"
kind = "library"
# `compress` is NativeCompression.
exports = ["compress"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
# Zstandard is Silk: the port of 1.5.7 in ../../zstd. zlib's streams are this package's own Silk
# (src/ext/zlib_stream.silk). brotli is C, compiled into a program only when it depends on this package.
zstd = { path = "../../zstd", package = "silkjs-zstd" }
brotli = { path = "../../native/brotli", package = "silkjs-brotli" }
